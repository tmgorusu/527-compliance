[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "compliance527"
version = "0.1.0"
description = "527 political organization CSV → filing-ready XML (IRS 8872 / Texas TEC plugin)"
requires-python = ">=3.11"
dependencies = [
  "lxml>=5.0",
  "pydantic>=2.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "openpyxl>=3.1"]
# openpyxl also required at runtime for Excel workbook ingest

[project.scripts]
compliance527 = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
